<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>162-0</title>
    <link rel="stylesheet" href="./styles.css?v=42">
  </head>
  <body>
    <main class="shell">
      <section class="scoreboard" aria-label="Game status">
        <div>
          <p class="eyebrow">Perfect Season Lab</p>
          <h1>162-0</h1>
        </div>
        <div class="status-strip">
          <div>
            <span>Round</span>
            <strong id="roundLabel">1 / 11</strong>
          </div>
          <div>
            <span>Skips</span>
            <strong id="skipLabel">Team 1 | Era 1</strong>
          </div>
          <div id="projectionStatus" class="hidden">
            <span>Projection</span>
            <strong id="projectionLabel">--</strong>
          </div>
        </div>
      </section>

      <section class="game-grid">
        <article class="field-panel" aria-label="Drafted roster">
          <div class="field-art">
            <svg class="field-logo" viewBox="0 0 520 420" role="img" aria-label="Baseball field roster">
              <path class="outfield" d="M52 126 C156 50 229 25 304 48 C354 62 413 101 478 138 L408 221 L260 360 L122 221 Z"></path>
              <path class="dirt" d="M260 360 L118 214 L260 104 L404 214 Z"></path>
              <path class="infield" d="M260 298 L168 208 L260 132 L354 208 Z"></path>
              <rect class="base home" x="246" y="348" width="28" height="28" transform="rotate(45 260 362)"></rect>
              <rect class="base first" x="390" y="200" width="22" height="22" transform="rotate(45 401 211)"></rect>
              <rect class="base second" x="249" y="94" width="22" height="22" transform="rotate(45 260 105)"></rect>
              <rect class="base third" x="108" y="200" width="22" height="22" transform="rotate(45 119 211)"></rect>
              <rect class="mound" x="244" y="196" width="32" height="18"></rect>
            </svg>
            <div class="field-copy hidden" id="fieldProjection">
              <span id="recordBig">--</span>
              <small>projected wins</small>
            </div>
            <div class="roster field-roster" id="roster"></div>
          </div>
          <div class="roster-details" id="rosterDetails"></div>
        </article>

        <article class="draft-panel" aria-label="Current draft round">
          <div class="slot-card">
            <div>
              <p class="eyebrow">Slot Machine</p>
              <h2 id="slotTitle">Roll your first matchup</h2>
            </div>
            <div class="slot-actions">
              <button id="teamSkipButton" class="icon-button" type="button" title="Skip team">T</button>
              <button id="eraSkipButton" class="icon-button" type="button" title="Skip era">E</button>
              <button id="rollButton" type="button">Roll</button>
            </div>
          </div>

          <div class="era-setup" id="eraSetup" aria-label="Era pool"></div>

          <div class="team-card" id="teamCard">
            <span class="team-mark" id="teamMark">162</span>
            <div>
              <p id="teamName">Waiting on the machine</p>
              <strong id="eraName">Any era</strong>
            </div>
          </div>

          <label class="search-box" for="playerSearch">
            <span>Player Search</span>
            <input id="playerSearch" type="search" autocomplete="off" placeholder="Type a player name" disabled>
          </label>

          <div class="choices" id="choices"></div>

          <section class="result-panel hidden" id="resultPanel" aria-live="polite">
            <div class="result-heading">
              <div>
                <p class="eyebrow">Final Scorecard</p>
                <h2 id="resultTitle">Season Complete</h2>
              </div>
              <button id="newGameButton" type="button">New Season</button>
            </div>
            <div class="result-scorecard" id="resultScorecard"></div>
            <p id="resultCopy"></p>
          </section>
        </article>
      </section>
    </main>

    <script src="./app.js?v=42"></script>
  </body>
</html>
